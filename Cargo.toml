[workspace]
resolver = "2"
members = ["attestation","client"]

[workspace.dependencies]
b64-ct = "0.1"
der = "0.7"
em-node-agent-client = "1.0"
env_logger = "0.11"
hyper = { version = "0.10", default-features = false }
ftx-cert-build = { git = "https://github.com/fortanix/ftx-cert-build.git" }
iocuddle = "0.1"
log = "0.4"
mbedtls = { version = "0.13", default-features = false }
nvml = { package = "nvml-wrapper", git = "https://github.com/fortanix/nvml-wrapper.git" }
nvml-wrapper = { git = "https://github.com/fortanix/nvml-wrapper.git" }
once_cell = "1.8"
pkix = "0.2"
serde = "1.0"
sgx_pkix = { version = ">=0.2.0, <0.4.0" }
sgx-isa = { version = ">=0.4.0, <0.6.0", default-features = false }
tdx-ql = "0.1"
thiserror = "1.0"
tokio = "=1.36"
vsock = "0.5"
