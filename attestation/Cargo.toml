[package]
name = "attestation"
description = "Attestation functionality for dcap, nvidia, sev, and tpm-snp attestation"
version = "0.2.0"
authors = ["Fortanix, Inc."]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/fortanix/attestation"

[features]
nitro = []
nitro-guest = ["nitro", "dep:serde_bytes", "dep:aws-nitro-enclaves-nsm-api", "mbedtls/rdrand"]
nvidia = []
nvidia-evidence = [
    "nvidia",
    "nvml",
] # enables the module used to collect nvidia attestation evidence
tdx = []
tdx-guest = ["tdx", "dep:tdx-ql"]
sev = []
sev-guest = ["sev", "dep:iocuddle"]
tpm-snp = []
tpm-snp-pkix-compat = ["tpm-snp", "sev"]
tpm-snp-evidence = ["tpm-snp", "nvidia-evidence", "sev-guest"]

[dependencies]
aws-nitro-enclaves-nsm-api = { workspace = true, optional = true }
b64-ct = { workspace = true }
der = { workspace = true, features = ["alloc", "derive", "oid", "pem"] }
log = { workspace = true }
mbedtls = { workspace = true, features = ["std", "time"] }
nvml = { workspace = true, optional = true }
once_cell = { workspace = true }
pkix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true, optional = true }
sgx-isa = { workspace = true, default-features = true }
sgx_pkix = { workspace = true }
thiserror = { workspace = true }
yasna = { workspace = true, features = ["num-bigint", "bit-vec"] }

[target.'cfg(not(target_env = "sgx"))'.dependencies]
# Used for generating reports on SNP, does not compile properly on SGX
iocuddle = { workspace = true, optional = true }
tdx-ql = { workspace = true, optional = true }

[[example]]
name = "tdreport_tool"
path = "src/tdx/tests/tdreport_tool.rs"
required-features = ["tdx-guest"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("fortanixvme"))'] }
